openapi: "3.0.0"
info:
  title: Array Response Test
  version: "1.0"
paths:
  /items:
    get:
      operationId: getItems
      responses:
        '200':
          description: List of items
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    value:
                      type: string